<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Certify</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Alex+Brush&family=Allura&family=Great+Vibes&display=swap" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

    <!-- Header -->
    <header class="app-header">
        <h1>Certify</h1>
    </header>

    <!-- Main Content -->
    <main class="main-container">
        <form th:action="@{/save}" th:object="${certificateContainer}" method="post" enctype="multipart/form-data" id="certForm">
            
            <div class="sections-grid">
                
                <!-- Left Section: User Input -->
                <section class="section-card">
                    <h2 class="section-title">User Input</h2>

                    <!-- Upload Template -->
                    <div class="form-group">
                        <label for="templateInput">Upload Template</label>
                        <input type="file" id="templateInput" th:field="*{template}" accept="image/*" required>
                    </div>

                    <!-- Upload CSV -->
                    <div class="form-group">
                        <label for="csvInput">Upload CSV</label>
                        <input type="file" id="csvInput" th:field="*{csv}" required>
                    </div>

                    <!-- Font -->
                    <div class="form-group">
                        <label for="font">Font</label>
                        <select id="font" th:field="*{font}">
                            <option value="Great Vibes">Great Vibes</option>
                            <option value="Alex Brush">Alex Brush</option>
                            <option value="Allura">Allura</option>
                            <option value="Arial">Arial</option>
                            <option value="Times New Roman">Times New Roman</option>
                            <option value="Georgia">Georgia</option>
                        </select>
                    </div>

                    <!-- Font Size -->
                    <div class="form-group">
                        <label for="fontSize">Font Size</label>
                        <input type="number" id="fontSize" th:field="*{fontSize}" placeholder="e.g. 40" required>
                    </div>

                    <!-- Hidden Coordinates -->
                    <input type="number" id="nameX" th:field="*{nameX}" style="display: none;">
                    <input type="number" id="nameY" th:field="*{nameY}" style="display: none;">

                    <!-- Generate Button -->
                    <input type="submit" value="Generate Certificates" id="submitBtn">
                </section>

                <!-- Right Section: Certificate Preview -->
                <section class="section-card">
                    <h2 class="section-title">Certificate Preview</h2>

                    <!-- Placeholder before image upload -->
                    <div id="previewPlaceholder" class="preview-placeholder">
                        Upload a template image to select position
                    </div>

                    <!-- Active Certificate Preview -->
                    <div id="previewSection" class="preview-section" style="display: none;">
                        
                        <div class="preview-header">
                            <span id="mouseCoords" class="coord-badge">0 | 0</span>
                        </div>

                        <!-- Image Canvas & Guides -->
                        <div class="image-wrapper">
                            <img id="templatePreview" alt="Certificate Template Preview">
                            <div id="verticalGuide" class="guide-line vertical-guide"></div>
                            <div id="horizontalGuide" class="guide-line horizontal-guide"></div>
                            <div id="clickMarker" class="click-marker"></div>
                        </div>

                        <!-- Selected Coordinates -->
                        <div class="selected-coords-box">
                            <strong>Selected Position</strong>
                            <div class="coords-display">
                                <span>X: <strong id="displayX">--</strong></span>
                                <span>Y: <strong id="displayY">--</strong></span>
                            </div>
                        </div>

                    </div>
                </section>

            </div>
        </form>
    </main>

    <script>
        document.addEventListener("DOMContentLoaded", function () {

            const templateInput = document.getElementById("templateInput");
            const templatePreview = document.getElementById("templatePreview");
            const previewSection = document.getElementById("previewSection");
            const previewPlaceholder = document.getElementById("previewPlaceholder");

            const mouseCoords = document.getElementById("mouseCoords");
            const displayX = document.getElementById("displayX");
            const displayY = document.getElementById("displayY");

            const nameX = document.getElementById("nameX");
            const nameY = document.getElementById("nameY");

            const clickMarker = document.getElementById("clickMarker");
            const verticalGuide = document.getElementById("verticalGuide");
            const horizontalGuide = document.getElementById("horizontalGuide");

            const certForm = document.getElementById("certForm");

            /*
             * Upload image
             */
            templateInput.addEventListener("change", function () {
                const file = templateInput.files[0];

                if (!file) {
                    return;
                }

                if (!file.type.startsWith("image/")) {
                    alert("Please select an image file.");
                    templateInput.value = "";
                    return;
                }

                templatePreview.src = URL.createObjectURL(file);

                templatePreview.onload = function () {
                    previewSection.style.display = "block";
                    if (previewPlaceholder) {
                        previewPlaceholder.style.display = "none";
                    }

                    nameX.value = "";
                    nameY.value = "";

                    displayX.textContent = "--";
                    displayY.textContent = "--";

                    clickMarker.style.display = "none";
                    verticalGuide.style.display = "none";
                    horizontalGuide.style.display = "none";
                };
            });

            /*
             * Get X and Y coordinates with center snapping and alignment guides
             */
            function getCoordinates(event) {
                let x = event.offsetX;
                let y = event.offsetY;

                const centerX = templatePreview.clientWidth / 2;
                const centerY = templatePreview.clientHeight / 2;
                const tolerance = 8;

                if (Math.abs(x - centerX) <= tolerance) {
                    x = centerX;
                    verticalGuide.style.left = centerX + "px";
                    verticalGuide.style.display = "block";
                } else {
                    verticalGuide.style.display = "none";
                }

                if (Math.abs(y - centerY) <= tolerance) {
                    y = centerY;
                    horizontalGuide.style.top = centerY + "px";
                    horizontalGuide.style.display = "block";
                } else {
                    horizontalGuide.style.display = "none";
                }

                const scaleX = templatePreview.naturalWidth / templatePreview.clientWidth;
                const scaleY = templatePreview.naturalHeight / templatePreview.clientHeight;

                const originalX = Math.round(x * scaleX);
                const originalY = Math.round(y * scaleY);

                return {
                    x: originalX,
                    y: originalY,
                    displayX: x,
                    displayY: y
                };
            }

            /*
             * Mouse movement
             */
            templatePreview.addEventListener("mousemove", function (event) {
                const coordinates = getCoordinates(event);
                mouseCoords.textContent = coordinates.x + " | " + coordinates.y;
            });

            /*
             * Mouse click
             */
            templatePreview.addEventListener("click", function (event) {
                const coordinates = getCoordinates(event);

                nameX.value = coordinates.x;
                nameY.value = coordinates.y;

                displayX.textContent = coordinates.x;
                displayY.textContent = coordinates.y;

                clickMarker.style.left = coordinates.displayX + "px";
                clickMarker.style.top = coordinates.displayY + "px";
                clickMarker.style.display = "block";
            });

            /*
             * Mouse leaves image
             */
            templatePreview.addEventListener("mouseleave", function () {
                mouseCoords.textContent = "0 | 0";
                verticalGuide.style.display = "none";
                horizontalGuide.style.display = "none";
            });

            /*
             * Check before submitting form
             */
            certForm.addEventListener("submit", function (event) {
                if (nameX.value === "" || nameY.value === "") {
                    event.preventDefault();
                    alert("Please click on the certificate image to select a position.");
                }
            });

        });
    </script>
</body>
</html>
